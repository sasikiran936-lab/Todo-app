<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      width: 65%;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 5px;
    }

    ul {
      padding: 0;
      margin-top: 20px;
    }

    li {
      background: #1e293b;
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    span {
      flex: 1;
      text-align: left;
      cursor: pointer;
    }

    .done {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .delete-btn {
      background: red;
      color: white;
      margin-left: 10px;
    }
  </style>
</head>

<body>

<h1>To-Do App</h1>

<input type="text" id="taskInput" placeholder="Enter a task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

<script>
  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function renderTasks() {
    let list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
      let li = document.createElement("li");

      li.innerHTML = `
        <span class="${task.done ? 'done' : ''}" onclick="toggleTask(${index})">
          ${task.text}
        </span>
        <button class="delete-btn" onclick="removeTask(${index})">X</button>
      `;

      list.appendChild(li);
    });
  }

  function addTask() {
    let input = document.getElementById("taskInput");
    let text = input.value.trim();

    if (text === "") {
      alert("Enter a task");
      return;
    }

    tasks.push({ text: text, done: false });
    saveTasks();
    renderTasks();

    input.value = "";
  }

  function removeTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    renderTasks();
  }

  function toggleTask(index) {
    tasks[index].done = !tasks[index].done;
    saveTasks();
    renderTasks();
  }

  // Load tasks on start
  renderTasks();
</script>

</body>
</html>
