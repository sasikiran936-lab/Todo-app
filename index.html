<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    input {
      padding: 10px;
      width: 70%;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    li {
      background: #1e293b;
      margin: 10px;
      padding: 10px;
      list-style: none;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>

<h1>To-Do App</h1>

<input type="text" id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

<script>
  function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value;

    if (task === "") return;

    let li = document.createElement("li");
    li.innerHTML = task + " <button onclick='removeTask(this)'>X</button>";

    document.getElementById("taskList").appendChild(li);

    input.value = "";
  }

  function removeTask(btn) {
    btn.parentElement.remove();
  }
</script>

</body>
</html>
